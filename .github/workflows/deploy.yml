name: פריסה ל-GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate bc-config.js from repo secret (not committed to git)
        env:
          BC_ALLOWLIST: ${{ secrets.BROADCAST_ALLOWLIST }}
        run: |
          node -e "
            const codes = (process.env.BC_ALLOWLIST || '').split(',').map(s => s.trim()).filter(Boolean);
            require('fs').writeFileSync('bc-config.js', 'window.BROADCAST_ALLOWLIST=' + JSON.stringify(codes) + ';\n');
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
